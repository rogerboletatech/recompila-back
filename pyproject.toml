[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recompila-bff"
version = "0.1.0"
description = "BFF do Recompila: contrato OpenAPI, OAuth2 e arquitetura hexagonal"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt>=2.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["recompila_bff*"]

[tool.vercel]
entrypoint = "recompila_bff.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
